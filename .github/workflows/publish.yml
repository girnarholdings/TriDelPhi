# Publish tridelphi to PyPI when a GitHub Release is published.
#
# There is no API token in this repository, and there should never be one.
# Publishing uses PyPI Trusted Publishing (OIDC): PyPI is configured to trust
# *this workflow, in this repository*, and mints a short-lived credential for
# the single upload. Nothing long-lived exists to leak, and a stolen repo
# secret cannot be replayed because there is no secret.
#
# ONE-TIME SETUP on PyPI, which cannot be done from here (see docs/RELEASES.md):
#   https://pypi.org/manage/account/publishing/ -> add a pending publisher
#     PyPI project name : tridelphi
#     Owner             : girnarholdings
#     Repository        : TriDelPhi
#     Workflow filename : publish.yml
#     Environment       : pypi
# Until that exists, the publish step fails with "not a trusted publisher" and
# nothing is uploaded — a safe failure, not a partial release.
#
# The release is gated on TriDelPhi's own scan. Shipping a security tool from a
# tree that tool would flag is the one bug this project cannot afford, so the
# gate runs before anything is uploaded and a critical stops the release.
name: Publish to PyPI

on:
  release:
    types: [published]
  # Dry run: build and check the artifacts without uploading, to confirm the
  # packaging is sound before cutting a real release.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and self-check
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install build tooling and TriDelPhi itself
        run: |
          python -m pip install --upgrade pip build twine
          python -m pip install -e .

      # Do not ship a security tool from a tree it would flag. Level 3 is the
      # offline core plus the workflow lint; the full ladder already runs on
      # every push in tridelphi.yml.
      - name: TriDelPhi gates its own release
        run: tridelphi . --level 3 --offline --format checklist --fail-on critical

      - name: The trust-lock must still hold at release time
        run: tridelphi verify . --offline

      - name: Build sdist and wheel
        run: python -m build

      # Metadata that PyPI would reject is far cheaper to catch here than
      # halfway through an upload.
      - name: Validate the distributions
        run: python -m twine check dist/*

      # The wheel must work from outside the checkout, or the package data
      # (vendored SARIF schema, rule tables) silently fails to ship.
      - name: The built wheel must run outside the source tree
        run: |
          python -m venv /tmp/relenv
          /tmp/relenv/bin/pip install --upgrade pip
          /tmp/relenv/bin/pip install dist/*.whl
          cd /tmp
          /tmp/relenv/bin/tridelphi --version
          /tmp/relenv/bin/python -c "
          from tridelphi.sarif import load_schema
          from tridelphi.tables import load_tables
          assert load_schema()['\$schema'].startswith('http://json-schema.org/draft-04/')
          assert load_tables().section('agent_signals', 'agents'), 'rule tables did not ship'
          print('packaged data OK')
          "

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    # Never on a dry run: workflow_dispatch builds and checks, nothing more.
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    # The environment is half of the trusted-publisher identity PyPI checks,
    # and it is where a required reviewer can be added to make releases
    # manually approved.
    environment:
      name: pypi
      url: https://pypi.org/p/tridelphi
    permissions:
      # Mint the OIDC token PyPI exchanges for the upload credential. This is
      # the only privilege this job holds — notably not contents: write.
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # PEP 740 attestations are signed with the same OIDC identity, so a
          # consumer can verify the file on PyPI came from this workflow.
          attestations: true
