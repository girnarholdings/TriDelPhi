# Publish tridelphi to PyPI when a GitHub Release is published.
#
# There is no API token in this repository, and there should never be one.
# Publishing uses PyPI Trusted Publishing (OIDC): PyPI is configured to trust
# *this workflow, in this repository*, and mints a short-lived credential for
# the single upload. Nothing long-lived exists to leak, and a stolen repo
# secret cannot be replayed because there is no secret.
#
# ONE-TIME SETUP on PyPI, which cannot be done from here (see docs/RELEASES.md):
#   https://pypi.org/manage/account/publishing/ -> add a pending publisher
#     PyPI project name : tridelphi
#     Owner             : girnarholdings
#     Repository        : TriDelPhi
#     Workflow filename : publish.yml
#     Environment       : pypi
# Until that exists, the publish step fails with "not a trusted publisher" and
# nothing is uploaded — a safe failure, not a partial release.
#
# The release is gated on TriDelPhi's own scan. Shipping a security tool from a
# tree that tool would flag is the one bug this project cannot afford, so the
# gate runs before anything is uploaded and a critical stops the release.
#
# The artifact is built where nothing unpinned runs. `build` installs only the
# hash-pinned closure in scripts/build-requirements.txt and builds without
# isolation, so no download it did not pin can touch the wheel. Everything
# that needs TriDelPhi's own (range-pinned) dependencies — the self-scan and
# the smoke test of the built wheel — runs in `verify`, a separate job that
# never uploads. `publish` then refuses any file whose digest differs from
# the one `build` recorded: a job output, which no later job can change.
name: Publish to PyPI

on:
  release:
    types: [published]
  # Dry run: build and check the artifacts without uploading, to confirm the
  # packaging is sound before cutting a real release.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build from pinned tooling
    runs-on: ubuntu-latest
    outputs:
      sha256sums: ${{ steps.digests.outputs.sha256sums }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # build, twine, setuptools and every dependency, by version and digest.
      # No `pip install --upgrade`, no build isolation: isolation would fetch
      # setuptools again, unpinned, into a throwaway environment.
      - name: Install the pinned build tooling
        run: python -m pip install --require-hashes -r scripts/build-requirements.txt

      - name: Build sdist and wheel
        run: python -m build --no-isolation

      # Metadata that PyPI would reject is far cheaper to catch here than
      # halfway through an upload.
      - name: Validate the distributions
        run: python -m twine check dist/*

      - name: Record what was built
        id: digests
        run: |
          cd dist
          sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS"
          cat "$RUNNER_TEMP/SHA256SUMS"
          echo "sha256sums=$(base64 -w0 < "$RUNNER_TEMP/SHA256SUMS")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  verify:
    name: Self-scan and smoke-test the build
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install TriDelPhi from this checkout
        run: python -m pip install -e .

      # Do not ship a security tool from a tree it would flag. Level 3 is the
      # offline core plus the workflow lint; the full ladder already runs on
      # every push in tridelphi.yml.
      - name: TriDelPhi gates its own release
        run: tridelphi . --level 3 --offline --format checklist --fail-on critical

      - name: The trust-lock must still hold at release time
        run: tridelphi verify . --offline

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      # The wheel must work from outside the checkout, or the package data
      # (vendored SARIF schema, rule tables) silently fails to ship.
      - name: The built wheel must run outside the source tree
        run: |
          python -m venv "$RUNNER_TEMP/relenv"
          "$RUNNER_TEMP/relenv/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/relenv/bin/tridelphi" --version
          "$RUNNER_TEMP/relenv/bin/python" -c "
          from tridelphi.sarif import load_schema
          from tridelphi.tables import load_tables
          assert load_schema()['\$schema'].startswith('http://json-schema.org/draft-04/')
          assert load_tables().section('agent_signals', 'agents'), 'rule tables did not ship'
          print('packaged data OK')
          "

  publish:
    name: Publish to PyPI
    # Never on a dry run: workflow_dispatch builds and checks, nothing more.
    if: github.event_name == 'release'
    needs: [build, verify]
    runs-on: ubuntu-latest
    # The environment is half of the trusted-publisher identity PyPI checks,
    # and it is where a required reviewer can be added to make releases
    # manually approved.
    environment:
      name: pypi
      url: https://pypi.org/p/tridelphi
    permissions:
      # Mint the OIDC token PyPI exchanges for the upload credential. This is
      # the only privilege this job holds — notably not contents: write.
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      # Publish exactly the files `build` produced — not a same-named
      # artifact uploaded later — and nothing besides them.
      - name: Check the files against the build's own digests
        env:
          SHA256SUMS: ${{ needs.build.outputs.sha256sums }}
        run: |
          printf '%s' "$SHA256SUMS" | base64 -d > "$RUNNER_TEMP/SHA256SUMS"
          cd dist
          sha256sum --check --strict -- "$RUNNER_TEMP/SHA256SUMS"
          test "$(ls -A | wc -l)" -eq "$(wc -l < "$RUNNER_TEMP/SHA256SUMS")"

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # PEP 740 attestations are signed with the same OIDC identity, so a
          # consumer can verify the file on PyPI came from this workflow.
          attestations: true
