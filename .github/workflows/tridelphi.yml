# TriDelPhi guarding TriDelPhi — the dogfood watcher.
#
# This is the workflow `tridelphi init` gives every user, with one difference:
# instead of installing from a registry it runs the composite action from this
# very checkout (`uses: ./`), so every new update is scanned by the version of
# TriDelPhi contained in that update. If a change breaks the scanner, the
# action, or the pinned ladder installs, this goes red on the PR that did it.
#
# What a red run gives you is the product experience end to end: the sticky
# plain-language PR comment, the merged SARIF in the Security tab, the ordered
# fix plan in the run's Summary — and a failed build.
name: TriDelPhi

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Default deny at the workflow level; the one job that needs write scopes
# declares them itself. A job added later starts with nothing.
permissions:
  contents: read

concurrency:
  group: tridelphi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Agents Rule of Two
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      # Level 7 signs the scan-evidence statement on push (skipped on PRs,
      # which never get OIDC). Signing needs the workflow's OIDC identity:
      id-token: write
      attestations: write
    steps:
      # Egress telemetry for this job itself (step-security/harden-runner,
      # Apache-2.0). Audit mode only observes; the ladder's osv rung needs
      # osv.dev, so a block policy would need that endpoint allowlisted.
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      # The scan only reads the tree; don't leave the token in .git/config for
      # later steps to find (zizmor: artipacked).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The one-line install path users take, run against its own source, at
      # the FULL ladder: gitleaks, osv-scanner, zizmor, scorecard (local mode),
      # semgrep, the Rule-of-Two core, the L6 evidence statement, and the L7
      # trust-lock check of every pinned action. Uploads the merged SARIF,
      # posts the sticky checklist comment — which now spells out what each
      # "worth a look" item is — and fails the job on a critical.
      - name: Run the full ladder from this checkout
        uses: ./
        with:
          level: 7

      # The action already failed the job; this adds the guard's Summary-tab
      # fix plan, same as the init-generated workflow. tridelphi is on PATH
      # because the composite action installed this checkout.
      - name: Fix plan to the run summary
        if: failure()
        run: |
          {
            echo '## 🔺 TriDelPhi found something a stranger could exploit'
            echo
            tridelphi fix --markdown || true
            echo
            echo 'Fix it from your terminal, interactively: `tridelphi guard`'
          } >> "$GITHUB_STEP_SUMMARY"
