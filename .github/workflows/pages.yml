name: Deploy site

# Publishes site/ to GitHub Pages so the landing page has a real URL.
#
# One-time setup, which cannot be done from a workflow: in the repository
# Settings -> Pages, set "Source" to "GitHub Actions". Until that is switched on,
# this workflow's deploy step fails with "Pages is not enabled".

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
      - 'scripts/check-site.py'
  workflow_dispatch:

# Deploy credentials are scoped to the deploy job below; the build job runs
# with read-only contents like everything else.
permissions:
  contents: read

# Never cancel a deploy midway; queue instead. A half-applied deploy is worse
# than a slightly stale site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify the site is self-contained
        # The page must render with no network: no CDN fonts, no remote scripts.
        # A remote asset silently degrades to a blank or unstyled page for anyone
        # behind a proxy, which is cheaper to catch here than in production.
        #
        # Prose hyperlinks are fine and expected — only *asset* references
        # (scripts, stylesheets, fonts, images) have to be local.
        run: python3 scripts/check-site.py

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
