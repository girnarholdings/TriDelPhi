# TriDelPhi fixing TriDelPhi — the dogfood fix bot.
#
# This is the reply-to-fix workflow `tridelphi init` gives every user, with one
# difference: instead of `pipx install tridelphi` from a registry it installs
# from this very checkout (`python3 -m pip install .`), so the bot that acts is
# always the trusted default-branch version of TriDelPhi. See tridelphi.yml, its
# twin, for the same dogfood swap on the scan side.
#
# Two ways to trigger it, both restricted to people this repo already trusts:
#   · reply `tridelphi fix` on a pull request (gated on author_association); OR
#   · tick the "Fix these for me" checkbox in TriDelPhi's own PR comment — GitHub
#     only lets users with write access toggle a task list, and the Authorize
#     step re-verifies that write access before anything runs.
# Because `issue_comment` workflows always run the file from the DEFAULT branch,
# a pull request cannot modify the bot that will act on it.
name: TriDelPhi fix

on:
  issue_comment:
    types: [created, edited]

# Default deny at the workflow level; only the fix job holds the write
# scopes it exists for. A job added later starts with nothing.
permissions:
  contents: read

concurrency:
  group: tridelphi-fix-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  fix:
    name: Apply verified fixes
    permissions:
      contents: write
      pull-requests: write
    # Trust boundary. Two ways in, both restricted to people this repo trusts:
    #   · a comment that says `tridelphi fix`, gated on author_association; OR
    #   · the "Fix these for me" checkbox in TriDelPhi's own comment — GitHub only
    #     lets users with write access toggle a task list, and the Authorize step
    #     below re-verifies that write access before anything runs. Both branches
    #     use positive `contains` only (never `!contains`/`!=`), so this stays the
    #     strong author_association gate our own detector recognises.
    if: >-
      github.event.issue.pull_request != null && (
        (contains(github.event.comment.body, 'tridelphi fix') &&
         contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
        ||
        (contains(github.event.comment.body, '<!--tridelphi-fix-->') &&
         contains(github.event.comment.body, '[x]'))
      )
    runs-on: ubuntu-latest
    steps:
      # Re-verify authorization before doing anything. The comment path is already
      # gated on author_association above; the checkbox path is gated by GitHub
      # (write access to toggle), which we confirm here — and we never act on the
      # bot's own edits (its periodic re-render of the comment).
      - name: Authorize the requester
        id: auth
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const p = context.payload;
            if (p.sender && p.sender.type === 'Bot') { core.setOutput('ok', 'false'); return; }
            if (p.action === 'created') { core.setOutput('ok', 'true'); return; }
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner, repo: context.repo.repo, username: p.sender.login,
            });
            const ok = ['admin', 'maintain', 'write'].includes(data.permission);
            core.setOutput('ok', ok ? 'true' : 'false');
            if (!ok) core.notice(`${p.sender.login} lacks write access; ignoring.`);

      # Egress is BLOCKED, not audited, in this workflow: it is the one place a
      # write-capable token and third-party code (pip's dependency tree) meet,
      # so a compromised package must have nowhere to send the credential. The
      # allowlist is everything the job legitimately needs — GitHub itself
      # (checkout, gh, push, API) and PyPI (pip install). If a step ever fails
      # with a blocked connection, the run's harden-runner log names the exact
      # endpoint to consider adding.
      - if: steps.auth.outputs.ok == 'true'
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443

      # Default-branch checkout; the credential stays so the verified commit
      # can be pushed at the end — pushing is this workflow's entire purpose.
      # zizmor's artipacked rule flags the persisted credential; here it is
      # required and no artifact is ever uploaded, so we document the exception
      # rather than break the push with persist-credentials: false.
      - if: steps.auth.outputs.ok == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4  # zizmor: ignore[artipacked]

      - if: steps.auth.outputs.ok == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      # Dogfood install: the acting tool is THIS default-branch checkout, not a
      # registry package. Installed before the pull-request checkout below, so it
      # is always the trusted `main` version of TriDelPhi that scans and fixes —
      # never code from the pull request it is acting on.
      - name: Install TriDelPhi from this checkout
        if: steps.auth.outputs.ok == 'true'
        run: python3 -m pip install --quiet .

      - name: Switch to the pull request branch (same-repo only)
        id: pr
        if: steps.auth.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          cross=$(gh pr view "$PR_NUMBER" --json isCrossRepository -q .isCrossRepository)
          if [ "$cross" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Fork pull request — the fix bot only pushes to this repo's own branches." >&2
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          gh pr checkout "$PR_NUMBER"

      - name: Apply the automatic fixes (each verified or rolled back)
        if: steps.pr.outputs.skip == 'false'
        id: apply
        run: |
          tridelphi fix --apply > fix-log.txt 2>&1 || true
          cat fix-log.txt
          {
            echo 'log<<TRIDELPHI_EOF'
            cat fix-log.txt
            echo TRIDELPHI_EOF
          } >> "$GITHUB_OUTPUT"

      - name: Push what verified
        if: steps.pr.outputs.skip == 'false'
        id: push
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No files changed — nothing was auto-fixable, or nothing verified."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "tridelphi: apply verified automatic fixes"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Report back
        if: steps.pr.outputs.skip == 'false'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          FIX_LOG: ${{ steps.apply.outputs.log }}
          CHANGED: ${{ steps.push.outputs.changed }}
        with:
          script: |
            const changed = process.env.CHANGED === 'true';
            const log = (process.env.FIX_LOG || '').slice(0, 50000);
            const headline = changed
              ? '🔺 **TriDelPhi applied its verified fixes** — each change below was re-scanned before it was kept.'
              : '🔺 **TriDelPhi had nothing it could fix automatically** — the remaining items need a human decision (`tridelphi guard` locally walks you through them).';
            const body = [headline, '', '```', log, '```'].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body,
            });
