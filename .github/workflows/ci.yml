name: CI
on:
  push:
    branches: [main]
  pull_request:
  # Manual re-run without an empty commit. Needed in practice: during a GitHub
  # Actions outage, jobs can be cancelled while queued, and re-running the
  # original run keeps inheriting the degraded attempt.
  workflow_dispatch:

permissions:
  contents: read

# A superseded run has nothing to say. Cancelling in-flight work on the same ref
# also stops a backed-up queue from holding runners that a newer push needs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip ruff==0.14.5
      - name: ruff
        run: ruff check tridelphi/ tests/ scripts/

  test:
    name: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: pytest
        run: python -m pytest -q

  wheel:
    name: wheel install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip build
      - name: Build wheel
        run: python -m build --wheel -o dist

      # `pip install -e .` leaves the repo on disk, so a missing package-data
      # entry stays invisible. Installing the built wheel into a clean
      # environment, from a directory that is not the checkout, is the only way
      # to catch the vendored SARIF schema or the YAML tables failing to ship.
      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/wheelenv
          /tmp/wheelenv/bin/pip install --upgrade pip
          /tmp/wheelenv/bin/pip install dist/*.whl
      - name: Packaged data must load outside the checkout
        working-directory: /tmp
        run: |
          /tmp/wheelenv/bin/tridelphi --version
          /tmp/wheelenv/bin/python -c "
          from tridelphi.sarif import load_schema, to_sarif
          from tridelphi.tables import load_tables
          assert load_schema()['\$schema'].startswith('http://json-schema.org/draft-04/')
          assert load_tables().section('agent_signals', 'agents'), 'agent table did not ship'
          assert to_sarif([], tool_version='0.0.0')['version'] == '2.1.0'
          print('packaged data OK')
          "
      - name: Scan a fixture from the installed console script
        run: |
          /tmp/wheelenv/bin/tridelphi tests/fixtures/malicious/comment-and-control \
            --format sarif > /tmp/out.sarif || true
          python -c "
          import json
          d = json.load(open('/tmp/out.sarif'))
          results = d['runs'][0]['results']
          assert results, 'installed CLI produced no findings on a malicious fixture'
          print('installed CLI emitted', len(results), 'result(s)')
          "

  self-scan:
    name: self-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      # A gate, not an uploader. The watcher workflow (tridelphi.yml) uploads
      # the merged level-7 SARIF on the same events; uploading core results
      # here too created duplicate code-scanning categories, duplicate alerts,
      # and an extra github-advanced-security onboarding notice per category.
      # One uploader; this job's exit code is its whole job.
      - run: tridelphi core . --format text

  redteam:
    name: redteam
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      # Brute-forces every synthetic attack encoding and fails if one slips past
      # or a benign near-miss is flagged. A visible "87/87" is the human signal;
      # tests/test_redteam.py is the same corpus gated inside pytest.
      - name: Adversarial detection sweep
        run: python scripts/redteam.py --show-missed

  # The bundle, exercised with the real scanners rather than test stubs: the
  # pinned installer must verify its checksums, and `--level 3` must run clean
  # on this repo (the ratchet — our own repo climbs its own ladder). --offline
  # keeps the job deterministic: osv-scanner's network rung is covered by unit
  # tests against recorded output, not by a live API call that can flake.
  ladder:
    name: ladder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - name: Install every pinned scanner (checksum-verified)
        # Level 5 installs all five wrapped tools; L6 adds only native code.
        run: bash scripts/install-ladder.sh 5
      - name: Ladder tests with real binaries
        # This is the only job where all five scanners exist, so it must run
        # every ladder test file — including the live schema-contract, L4-L7
        # and adversarial tests that skip themselves elsewhere.
        run: >
          python -m pytest -q
          tests/test_ladder.py
          tests/test_ladder_adversarial.py
          tests/test_ladder_sarif.py
          tests/test_ladder_l456.py
          tests/test_verify_l7.py
          tests/test_orchestrate.py
      - name: Dogfood the full bundle on this repo
        # Level 7: run every rung, attest over the merged SARIF, then verify the
        # committed trust-lock. --offline keeps it deterministic (no osv.dev, no
        # provenance fetch); the trust-lock pawl is offline by design anyway.
        run: tridelphi . --level 7 --offline --sarif-file tridelphi.sarif --format text
      - name: The gate re-checks the merged SARIF as its own step
        run: tridelphi gate tridelphi.sarif
      - name: The trust-lock pawl must pass on this repo
        run: tridelphi verify . --offline

  bot:
    name: bot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      # The Worker's signature check is the bot's security boundary. Node runs
      # the same WebCrypto the Worker uses, so no wrangler is needed to gate it.
      - name: Webhook signature tests
        working-directory: bot
        run: node test/verify.test.mjs

  # A single check to require in branch protection. Adding a job above without
  # listing it here would silently widen what can merge, so it is spelled out.
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    needs: [lint, test, wheel, self-scan, redteam, ladder, bot]
    if: always()
    steps:
      - name: Fail if any required job did not succeed
        run: |
          echo "lint=${{ needs.lint.result }}"
          echo "test=${{ needs.test.result }}"
          echo "wheel=${{ needs.wheel.result }}"
          echo "self-scan=${{ needs.self-scan.result }}"
          echo "redteam=${{ needs.redteam.result }}"
          echo "ladder=${{ needs.ladder.result }}"
          echo "bot=${{ needs.bot.result }}"
          [ "${{ needs.lint.result }}" = "success" ] \
            && [ "${{ needs.test.result }}" = "success" ] \
            && [ "${{ needs.wheel.result }}" = "success" ] \
            && [ "${{ needs.self-scan.result }}" = "success" ] \
            && [ "${{ needs.redteam.result }}" = "success" ] \
            && [ "${{ needs.ladder.result }}" = "success" ] \
            && [ "${{ needs.bot.result }}" = "success" ]
