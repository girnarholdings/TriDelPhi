name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  self-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      # Text in the job log is what a human reading a red check actually sees;
      # the SARIF file is for upload. Needing both is why they are separate flags.
      - run: tridelphi core . --format text --sarif-file tridelphi.sarif
      # `if: always()` is mandatory: the scan exits 1 on findings, so without it
      # the upload is skipped and results never reach code scanning.
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: tridelphi.sarif
