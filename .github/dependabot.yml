# Automated dependency updates. Every bump arrives as a pull request, which
# means TriDelPhi scans it, comments on it, and gates it like any other change
# — the update tool and the thing that audits updates are the same pipeline.
#
# Deliberately NOT covered here: scripts/*-requirements.txt. Those are
# hash-pinned dependency closures for the wrapped scanners, regenerated
# wholesale from a clean venv (see the header of each file) so that
# `pip install --require-hashes` stays the trust boundary. A line-item bump
# inside a closure is how you get an unresolvable or unreviewed mix.
version: 2
updates:
  # The SHA-pinned actions in .github/workflows and action.yml. Dependabot
  # updates the pin and the version comment together, keeping the trust-lock
  # (L7) story reviewable: every bump is a diff naming old and new version.
  # Grouped into ONE pull request on purpose. Ungrouped, a weekly sweep opened
  # six separate action bumps, and every one of them tripped the L7 trust-lock
  # independently — six reviews, six re-locks, six approvals, and a rebase
  # treadmill as each merge invalidated the others. One pull request means one
  # re-lock and one decision, which is also how a human would have done it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  # The Python package itself — and ONLY the four dependencies pyproject.toml
  # actually declares. The `allow` list is load-bearing, not decoration: the pip
  # ecosystem walks the whole tree and finds scripts/*-requirements.txt, which
  # are hash-pinned closures for the wrapped scanners. Those are regenerated
  # wholesale (see each file's header) because semgrep pins its dependencies
  # exactly; a single-package bump inside one is unresolvable by construction
  # and produces a pull request that can never go green. Naming what we DO want
  # is the only way to say that to Dependabot.
  #
  # `allow` names dependencies, but Dependabot edits every file a named
  # dependency appears in — so a package that is in BOTH pyproject.toml and a
  # closure drags the closure along and breaks it. `ruamel.yaml` and
  # `jsonschema` are exactly that: semgrep constrains them, and bumping them in
  # the closure fails with ResolutionImpossible (this is what sank #47). They
  # are therefore not watched here; they move when the closure is regenerated
  # for a semgrep upgrade, which is the only way they can move coherently.
  #
  # Adding a dependency to pyproject.toml? Add it here too — but first check it
  # does not appear in scripts/*-requirements.txt:
  #     grep -l '^<name>==' scripts/*-requirements.txt
  # A hit means leave it out, for the reason above.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    allow:
      - dependency-name: pytest
      - dependency-name: ruff
    groups:
      python:
        patterns: ["*"]

  # The webhook bot worker.
  - package-ecosystem: npm
    directory: /bot
    schedule:
      interval: weekly
    groups:
      bot:
        patterns: ["*"]
