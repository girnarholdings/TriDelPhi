# Composite action — the one-line way to run the TriDelPhi hardening ladder.
#
#   - uses: girnarholdings/TriDelPhi@d5c01388c21de9c1d12159087890d12d2d917990 # v3.1.1
#
# By default it climbs the full L1-L3 ladder over the checked-out repo:
#
#   L1  gitleaks     (MIT)         secrets committed to the tree
#   L2  osv-scanner  (Apache-2.0)  known-vulnerable dependencies (queries osv.dev)
#   L3  zizmor       (MIT)         workflow lint  +  tridelphi core (native)
#
# then uploads one merged SARIF to code scanning and (on a pull request) posts
# a sticky plain-language comment. The wrapped scanners are pinned by version
# and checksum-verified at install; see scripts/install-ladder.sh. Full credit
# to their authors — run `tridelphi --credits`.
#
# Prefer `tridelphi init`, which writes a complete workflow; this is for people
# who already have a workflow and want one step.
name: TriDelPhi
description: >-
  The GitHub Actions hardening ladder in one step — TriDelPhi's Agents Rule of
  Two capability scan plus wrapped runs of gitleaks, osv-scanner and zizmor,
  merged into a single code-scanning upload.
branding:
  icon: shield
  color: red

inputs:
  path:
    description: Repository root to scan.
    default: "."
  level:
    description: >-
      Hardening-ladder rung to climb to (cumulative): 0 core only; 1 +gitleaks
      (secrets); 2 +osv-scanner (supply chain, queries osv.dev); 3 +zizmor
      (workflow lint); 4 +scorecard (repo posture); 5 +semgrep (code SAST);
      6 +attest (writes a signed-elsewhere evidence statement); 7 +trust
      (verify consumed actions against the committed trust-lock). Default 3
      stays lean and fast; 5+ pulls in semgrep's dependency tree, so opt into it.
      Levels 6-7 also require `id-token: write` and `attestations: write` in the
      calling job. Level 7 needs a reviewed `.tridelphi/trust.lock`; create it
      once with `tridelphi verify --write-trust-lock` and commit it.
    default: "3"
  fail-on:
    description: Exit non-zero at this level or above (critical | warning | none).
    default: critical
  comment:
    description: Post a sticky PR comment with the report (true | false).
    default: "true"
  expose:
    description: >-
      Also audit your shipped product with `tridelphi expose` — source maps,
      client secrets in bundles, weak password hashing, plaintext PII, and
      self-hosted DB misconfig. Advisory only: it uploads to code scanning but
      never fails the build, because a static audit can't reach a running
      server and a flagged config may already be firewalled. It sees only built
      output present in the checkout, so build first (or it finds nothing).
    default: "false"
  pr-annotations:
    description: >-
      Also upload SARIF on pull_request events. Off by default on purpose: a
      PR upload makes github-advanced-security[bot] re-voice TriDelPhi's own
      findings as inline review comments, duplicating the sticky comment this
      action already posts. With the default, pull requests get one voice (the
      comment + the gate) and code scanning stays the historical record,
      refreshed by every push to your default branch.
    default: "false"
  pr-number:
    description: >-
      Comment on this pull request instead of inferring one from the event. Only
      needed when the run was started by something other than a pull_request
      event — a workflow_dispatch from the Cloudflare control plane, say, which
      knows the number but cannot make GitHub deliver a pull_request event.
      Leave empty for the ordinary case.
    default: ""
  sarif-file:
    description: Where to write SARIF for code-scanning upload.
    default: tridelphi.sarif
  evidence-file:
    description: With level 6, where to write the in-toto evidence statement.
    default: tridelphi-evidence.json
  trust-lock:
    description: With level 7, the committed trust-lock file to verify against.
    default: .tridelphi/trust.lock

runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'

    # One setup step: TriDelPhi from the action's own checkout (so the scan
    # runs exactly this ref, no registry in the path), then the ladder scanners
    # the chosen level needs (pinned + checksum-verified; the installer is
    # level-gated, so level 3 never pulls in semgrep's dependency tree).
    - name: Set up TriDelPhi and the ladder
      shell: bash
      env:
        LEVEL: ${{ inputs.level }}
        # Nobody reading a security report needs pip's upgrade advert.
        PIP_DISABLE_PIP_VERSION_CHECK: "1"
        PIP_NO_PYTHON_VERSION_WARNING: "1"
      run: |
        echo "::group::Installing TriDelPhi and the level-${LEVEL} scanners"
        python3 -I -m pip install --quiet "$GITHUB_ACTION_PATH"
        bash "$GITHUB_ACTION_PATH/scripts/install-ladder.sh" "$LEVEL"
        echo "::endgroup::"
        echo "TriDelPhi $(tridelphi --version 2>/dev/null || echo '?') ready at level ${LEVEL}"

    - name: Scan
      id: scan
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
        LEVEL: ${{ inputs.level }}
        FAIL_ON: ${{ inputs.fail-on }}
        SARIF_FILE: ${{ inputs.sarif-file }}
        EVIDENCE_FILE: ${{ inputs.evidence-file }}
        TRUST_LOCK: ${{ inputs.trust-lock }}
      # Never fail this step; the SARIF upload and PR comment must run
      # regardless. The threshold is enforced as the final step.
      run: |
        set +e
        REPORT_TEXT="$RUNNER_TEMP/tridelphi-report.txt"
        REPORT_MD="$RUNNER_TEMP/tridelphi-report.md"
        INTERNAL_SARIF="$RUNNER_TEMP/tridelphi.sarif"
        INTERNAL_EVIDENCE="$RUNNER_TEMP/tridelphi-evidence.json"
        EXIT_MARKER="$RUNNER_TEMP/tridelphi-exit-code"
        rm -f -- "$REPORT_TEXT" "$REPORT_MD" "$INTERNAL_SARIF" \
          "$INTERNAL_EVIDENCE" "$EXIT_MARKER"
        LEVEL_ARGS=()
        if [ "$LEVEL" -ge 1 ] 2>/dev/null; then
          LEVEL_ARGS=(--level "$LEVEL" --evidence-file "$INTERNAL_EVIDENCE" --trust-lock "$TRUST_LOCK")
        fi
        tridelphi "$SCAN_PATH" "${LEVEL_ARGS[@]}" \
          --format checklist \
          --sarif-file "$INTERNAL_SARIF" \
          --checklist-md-file "$REPORT_MD" \
          --fail-on "$FAIL_ON" > "$REPORT_TEXT" 2>&1
        code=$?

        # Uploads and comments consume the private runner-temp copies. Preserve
        # the public output-path inputs with a bounded atomic copy that refuses
        # source or destination symlinks. A hostile checkout can therefore
        # neither redirect an artifact write nor leave stale SARIF to upload.
        TRIDELPHI_INTERNAL_SARIF="$INTERNAL_SARIF" \
        TRIDELPHI_INTERNAL_EVIDENCE="$INTERNAL_EVIDENCE" \
        TRIDELPHI_REQUESTED_SARIF="$SARIF_FILE" \
        TRIDELPHI_REQUESTED_EVIDENCE="$EVIDENCE_FILE" \
          python3 -I - <<'PY'
        import os
        import sys
        from pathlib import Path

        from tridelphi.fsutil import atomic_copy_file

        copies = (
            (os.environ["TRIDELPHI_INTERNAL_SARIF"], os.environ["TRIDELPHI_REQUESTED_SARIF"]),
            (os.environ["TRIDELPHI_INTERNAL_EVIDENCE"], os.environ["TRIDELPHI_REQUESTED_EVIDENCE"]),
        )
        try:
            for source, destination in copies:
                if Path(source).is_file():
                    atomic_copy_file(source, destination)
        except (OSError, ValueError):
            print("TriDelPhi could not safely copy a requested artifact path.", file=sys.stderr)
            raise SystemExit(1)
        PY
        copy_code=$?
        if [ "$copy_code" -ne 0 ]; then
          code=2
        fi

        printf '%s\n' "$code" > "$EXIT_MARKER"
        if [ -s "$INTERNAL_SARIF" ]; then
          echo "sarif_ready=true" >> "$GITHUB_OUTPUT"
        else
          echo "sarif_ready=false" >> "$GITHUB_OUTPUT"
        fi
        if [ -s "$INTERNAL_EVIDENCE" ]; then
          echo "evidence_ready=true" >> "$GITHUB_OUTPUT"
        else
          echo "evidence_ready=false" >> "$GITHUB_OUTPUT"
        fi

        # The Summary tab is where a non-expert lands from the email. Put the
        # readable report there, not only in the log, so nobody has to expand a
        # job to find out whether they are safe.
        if [ -f "$REPORT_MD" ]; then
          cat "$REPORT_MD" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "TriDelPhi could not produce the readable report; the final gate will fail." \
            >> "$GITHUB_STEP_SUMMARY"
        fi
        echo "TriDelPhi finished. Open the job Summary for the plain-language report."
        exit 0

    # Skipped on pull requests unless pr-annotations is on: uploading here makes
    # code scanning echo the same findings back as inline bot comments, and the
    # sticky comment below already says it better. Pushes always upload, so the
    # Security tab tracks the default branch.
    - name: Upload to code scanning
      if: ${{ always() && steps.scan.outputs.sarif_ready == 'true' && (github.event_name != 'pull_request' || inputs.pr-annotations == 'true') }}
      uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
      with:
        sarif_file: ${{ runner.temp }}/tridelphi.sarif
        category: tridelphi

    # Optional exposure audit of the *shipped product* (built JS, DB/config).
    # Opt-in and advisory: it never fails the build (--fail-on none), and it can
    # only see build output that is present in the checkout — so it is worth
    # enabling only after a build step has produced e.g. ./dist.
    - name: Audit shipped output
      id: exposure
      if: ${{ inputs.expose == 'true' }}
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
      # Never fail this step; the audit is advisory and its SARIF still uploads.
      run: |
        set +e
        EXPOSURE_SARIF="$RUNNER_TEMP/tridelphi-expose.sarif"
        EXPOSURE_MD="$RUNNER_TEMP/tridelphi-expose.md"
        EXPOSURE_TEXT="$RUNNER_TEMP/tridelphi-expose.txt"
        rm -f -- "$EXPOSURE_SARIF" "$EXPOSURE_MD" "$EXPOSURE_TEXT"
        tridelphi expose "$SCAN_PATH" \
          --format checklist \
          --sarif-file "$EXPOSURE_SARIF" \
          --checklist-md-file "$EXPOSURE_MD" \
          --fail-on none > "$EXPOSURE_TEXT" 2>&1
        if [ -s "$EXPOSURE_SARIF" ]; then
          echo "sarif_ready=true" >> "$GITHUB_OUTPUT"
        else
          echo "sarif_ready=false" >> "$GITHUB_OUTPUT"
        fi
        if [ -f "$EXPOSURE_MD" ]; then
          cat "$EXPOSURE_MD" >> "$GITHUB_STEP_SUMMARY"
        fi
        echo "TriDelPhi exposure audit finished. Open the job Summary for its report."
        exit 0

    - name: Upload exposure audit to code scanning
      if: ${{ inputs.expose == 'true' && always() && steps.exposure.outputs.sarif_ready == 'true' && (github.event_name != 'pull_request' || inputs.pr-annotations == 'true') }}
      uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
      with:
        sarif_file: ${{ runner.temp }}/tridelphi-expose.sarif
        category: tridelphi-expose

    # L6: publish the evidence statement as a signed build attestation, so a
    # consumer can verify what scanned this commit. Runs only at level 6, only
    # on push (attestations need the workflow's own OIDC identity, which fork
    # PRs do not get), and only if the evidence file was written.
    - name: Attest the scan evidence
      if: ${{ (inputs.level == '6' || inputs.level == '7') && github.event_name != 'pull_request' && steps.scan.outputs.evidence_ready == 'true' }}
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: ${{ runner.temp }}/tridelphi-evidence.json

    - name: Comment on the pull request
      # Fork pull_request tokens are read-only by platform policy and cannot
      # comment. Skip that impossible write instead of turning a completed scan
      # into a misleading 403; its report remains in the job Summary and gate.
      if: ${{ inputs.comment == 'true' && (inputs.pr-number != '' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        REPORT_FILE: ${{ runner.temp }}/tridelphi-report.md
        PR_NUMBER: ${{ inputs.pr-number }}
      with:
        script: |
          // The comment is what the notification email renders, so it is real
          // Markdown — verdict heading, status table, details fold — not a
          // monospace dump.
          const fs = require('fs');
          function readBounded(path, limit = 60000) {
            if (!path) return '';
            let fd;
            try {
              fd = fs.openSync(path, 'r');
              const buffer = Buffer.alloc(limit);
              const count = fs.readSync(fd, buffer, 0, limit, 0);
              return buffer.subarray(0, count).toString('utf8');
            } catch (_error) {
              return '';
            } finally {
              if (fd !== undefined) fs.closeSync(fd);
            }
          }
          // The renderer escapes repository-derived Markdown. Neutralize @ as
          // an extra boundary so a filename cannot notify an unrelated user.
          const report = (readBounded(process.env.REPORT_FILE) ||
            'TriDelPhi produced no readable report.').replaceAll('@', '&#64;');
          // On a pull_request event the number is in the context; a dispatched
          // run has no such context and passes it explicitly instead.
          const issue_number = Number(process.env.PR_NUMBER) || context.issue.number;
          if (!issue_number) {
            core.notice('No pull request to comment on; skipping.');
            return;
          }
          const body = [
            '<!-- tridelphi -->',
            report.slice(0, 60000),
            '',
            '_[What this means](https://girnarholdings.github.io/TriDelPhi/)._',
          ].join('\n');
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner, repo: context.repo.repo,
            issue_number,
          });
          const existing = comments.find(c => c.body && c.body.includes('<!-- tridelphi -->'));
          const api = existing
            ? github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body })
            : github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number, body });
          await api;

    - name: Enforce the threshold
      shell: bash
      run: |
        code=2
        if [ -f "$RUNNER_TEMP/tridelphi-exit-code" ]; then
          IFS= read -r code < "$RUNNER_TEMP/tridelphi-exit-code"
        fi
        case "$code" in
          0) exit 0 ;;
          1) exit 1 ;;
          2) exit 2 ;;
          *) echo "TriDelPhi returned an invalid status; failing closed." >&2; exit 2 ;;
        esac
