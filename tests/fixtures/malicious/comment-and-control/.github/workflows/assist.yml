name: Comment assistant
on:
  issue_comment:
    types: [created]

jobs:
  assist:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          prompt: |
            A user commented on the issue. Respond helpfully.
            Comment: ${{ github.event.comment.body }}
          claude_args: "--allowedTools Bash,WebFetch"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
