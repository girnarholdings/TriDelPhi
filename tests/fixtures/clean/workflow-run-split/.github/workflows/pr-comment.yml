name: PR comment
on:
  workflow_run:
    workflows: ["PR build"]
    types: [completed]

jobs:
  comment:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post status
        run: gh pr comment "$PR" --body "Build finished with ${{ github.event.workflow_run.conclusion }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
