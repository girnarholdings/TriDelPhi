# Uses the real CVE-2025-30066 malicious commit to test a source pin replacement.
# The committed lock records a previously reviewed pin, so `tridelphi verify`
# flags the repository diff. This does not claim an offline scan sees remote tag
# movement; mutable tags are rejected separately as unpinned.
name: CI
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: tj-actions/changed-files@0e58ed8671d6b60d0890c21b07f8835ace038e67 # v45.0.7
