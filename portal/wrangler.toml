name = "tridelphi-scan-portal"
main = "src/index.js"
compatibility_date = "2026-08-01"
workers_dev = false
preview_urls = false
# Dedicated origin keeps portal session cookies off the existing homepage host.
# Requires the tridelphi.com zone to be active in this Cloudflare account.
routes = [
  { pattern = "scan.tridelphi.com", custom_domain = true }
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[observability]
enabled = false

[vars]
# GitHub App: https://github.com/apps/tridelphi-security
# Public identifiers only. GITHUB_CLIENT_SECRET must be a Wrangler secret.
PUBLIC_ORIGIN = "https://scan.tridelphi.com"
GITHUB_APP_ID = "4889186"
GITHUB_APP_SLUG = "tridelphi-security"
GITHUB_CLIENT_ID = "Iv23li3y8yo2DOaLlZ7K"
SCANNER_REPO = "girnarholdings/TriDelPhi"
# The released scanner commit (tag v3.2.0 on main). It carries the tested scan
# devcontainer and `tridelphi audit`; the scanner tree is byte-identical to the
# earlier published candidate 78fb220. A change here only takes effect on the
# next portal deploy. Keep this a full SHA, never a moving branch name.
SCANNER_REF = "b7d5f909aab5ae8a118a0e43c7302859d3f1bca9"
# JSON mapping immutable GitHub user IDs to UTC expiry timestamps (milliseconds).
# Operator-managed pilot entitlements only; NOT a payment processor.
PAID_ENTITLEMENTS = "{}"

[[durable_objects.bindings]]
name = "PORTAL_STATE"
class_name = "PortalState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PortalState"]

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }
