# Curated, LOCAL semgrep rules for `tridelphi expose` — data-hygiene patterns
# in application code. Shipped inside the package and run with an explicit
# `--config <this dir> --metrics off`, never `--config auto` and never the
# registry, so the exposure audit stays fully offline.
#
# These are heuristics: they name a file:line to check, they do not prove a
# defect. Severity is deliberately conservative — WARNING ("worth a look"),
# never a build-gating error — because a false positive that fails someone's
# build is worse than a missed advisory. The native detectors in expose.py
# own the high-confidence, gating findings (public DB + default password,
# published source maps, live secrets in shipped bundles).
rules:
  - id: tridelphi-weak-password-hash-python
    languages: [python]
    severity: WARNING
    message: >-
      This hashes what looks like a password/secret with a fast hash (md5/sha1).
      A stolen table is brute-forceable in minutes. Use a slow password hash —
      argon2id or bcrypt (cost >= 12) — not a general-purpose digest.
    metadata:
      category: security
      tridelphi: weak-password-hash
    patterns:
      - pattern-either:
          - pattern: hashlib.md5($X)
          - pattern: hashlib.sha1($X)
          - pattern: hashlib.sha256($X)
      - metavariable-regex:
          metavariable: $X
          regex: (?i).*(pass|pwd|secret|passwd).*

  - id: tridelphi-weak-password-hash-js
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      If this hashes a password, md5/sha1 is not safe — a stolen table is
      brute-forceable. Use bcrypt or argon2 (a real password-hashing library),
      not crypto.createHash.
    metadata:
      category: security
      tridelphi: weak-password-hash
    pattern-either:
      - pattern: crypto.createHash("md5")
      - pattern: crypto.createHash('md5')
      - pattern: crypto.createHash("sha1")
      - pattern: crypto.createHash('sha1')

  - id: tridelphi-token-in-web-storage
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      A token/credential written to localStorage or sessionStorage is readable
      by any script on the page, so any XSS steals it. Keep session tokens in an
      HttpOnly, Secure cookie instead — JavaScript should not be able to read them.
    metadata:
      category: security
      tridelphi: token-in-web-storage
    patterns:
      - pattern-either:
          - pattern: localStorage.setItem($K, ...)
          - pattern: sessionStorage.setItem($K, ...)
      - metavariable-regex:
          metavariable: $K
          regex: (?i).*(token|jwt|auth|secret|session|password|pwd).*

  - id: tridelphi-hardcoded-db-credential
    languages: [generic]
    severity: WARNING
    message: >-
      A database connection string with an inline username:password was found in
      code. Read it from a server-side environment variable or secret store, and
      rotate the credential if this file is committed or shipped.
    metadata:
      category: security
      tridelphi: hardcoded-db-credential
    options:
      generic_ellipsis_max_span: 0
    # `.env` and compose files are owned by expose's native category D, which
    # runs even when semgrep is absent — exclude them here to avoid a duplicate.
    paths:
      exclude:
        - ".env"
        - ".env.*"
        - "*compose*.yml"
        - "*compose*.yaml"
        - "*.md"
    pattern-regex: (?i)\b(postgres|postgresql|mysql|mariadb|mongodb(\+srv)?|redis|amqp)://[^:@/\s"']+:[^@/\s"']+@

  - id: tridelphi-jwt-verify-disabled-python
    languages: [python]
    severity: WARNING
    message: >-
      JWT signature verification is turned off here (verify_signature False or the
      'none' algorithm). Any attacker can then forge a token and log in as anyone.
      Pin the expected algorithm and verify the signature.
    metadata:
      category: security
      tridelphi: jwt-verify-disabled
    pattern-either:
      - pattern: 'jwt.decode(..., options={..., "verify_signature": False, ...}, ...)'
      - pattern: jwt.decode(..., verify=False, ...)
      - pattern: jwt.decode(..., algorithms=["none"], ...)
      - pattern: jwt.decode(..., algorithms=["None"], ...)

  - id: tridelphi-jwt-none-algorithm-js
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      This accepts the JWT 'none' algorithm, which means an unsigned, forgeable
      token is treated as valid. Verify with a fixed algorithm (e.g. RS256/HS256).
    metadata:
      category: security
      tridelphi: jwt-verify-disabled
    pattern-regex: (?i)algorithms\s*:\s*\[\s*['"]none['"]

  - id: tridelphi-tls-verify-disabled-python
    languages: [python]
    severity: WARNING
    message: >-
      TLS certificate verification is disabled here, so a network attacker can
      man-in-the-middle this connection and read or alter the traffic. Keep
      verification on and fix the certificate chain instead.
    metadata:
      category: security
      tridelphi: tls-verify-disabled
    pattern-either:
      - pattern: requests.get(..., verify=False, ...)
      - pattern: requests.post(..., verify=False, ...)
      - pattern: requests.put(..., verify=False, ...)
      - pattern: requests.delete(..., verify=False, ...)
      - pattern: requests.patch(..., verify=False, ...)
      - pattern: requests.head(..., verify=False, ...)
      - pattern: requests.request(..., verify=False, ...)
      - pattern: ssl._create_unverified_context(...)
