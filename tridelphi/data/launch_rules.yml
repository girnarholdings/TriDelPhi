# Launch-door patterns for `tridelphi launch`.
#
# Hosts, SDK snippets, and phrases live here so a new vendor is a data change.
# Structural decisions (what counts as a signup, when a checklist replaces a
# detector) live in tridelphi/launch.py. Nothing in this file is legal advice,
# and a match is a pattern in a file — not a determination that a statute applies.
#
# Short tokens that would false-positive as substrings ("dob" inside "adobe")
# are not listed here; the detector uses word boundaries for those.

version: 2

scope: >-
  This is not legal advice. A clean result is not a compliance certificate.
  TriDelPhi only matched patterns in files it could read.

categories:
- id: A
  question: "Does signup ask age before an account exists?"
  gloss: "COPPA — penalties in this family are framed per child under 13."
- id: B
  question: "Do pages load fonts from someone else's server?"
  gloss: "GDPR / ePrivacy — a third-party font request is framed per visitor."
- id: C
  question: "Is session replay or a chat widget on without consent?"
  gloss: "CIPA and similar wiretap statutes — session replay and third-party chat are often framed per
    session."
- id: D
  question: "Do marketing emails have an unsubscribe and address?"
  gloss: "CAN-SPAM — penalties in this family are framed per email."
- id: E
  question: "Are renewal terms next to the subscribe button?"
  gloss: "California automatic renewal law, as amended (contracts from July 1, 2025), and ROSCA — per
    subscription. The 2024 FTC Negative Option Rule was vacated in 2025."
- id: F
  question: "Is there a DMCA agent page a visitor can find?"
  gloss: "DMCA designated agent — the $6 copyright.gov filing is a checklist."
- id: G
  question: "Can a visitor open privacy and terms pages?"
  gloss: "Privacy notice and terms — expected per consumer or per visitor."
- id: H
  question: "Do analytics or ad tags wait for consent?"
  gloss: "ePrivacy, plus CCPA/CPRA when an ad or analytics tag is present."
- id: I
  question: "Do marketing texts ask for express consent?"
  gloss: "TCPA — statutory damages in this family are framed per text or call."
- id: J
  question: "Is AI disclosed, or marketed as human-made?"
  gloss: "EU AI Act transparency and FTC advertising — checklists, not a deception finding."
- id: K
  question: "Can people report uploads they did not make?"
  gloss: "User content needs a report path next to a DMCA agent."
- id: L
  question: "Might health or bank data make a statute apply?"
  gloss: "HIPAA / GLBA checklist only — this does not audit either statute."
- id: M
  question: "Are vendored frontend licenses attributed?"
  gloss: "A NOTICE check for vendored files — not a license scanner."
- id: N
  question: "Do images have alt text, and do primary pages have a landmark?"
  gloss: "One accessibility note when a page has neither — not a WCAG audit."

