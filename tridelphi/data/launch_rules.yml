rules:
- id: coppa-age-gate
  category: A
  severity: warning
  kind: static
  message: >-
    COPPA (children's privacy): {detail} creates an account and never asks for an age, a date of birth,
    or an under-13 gate. The FTC amended 16 C.F.R. Part 312 in 2025; most operators have until April 22,
    2026 to comply. Penalties in this family are framed per child under 13 (about $53,000 in the figure
    this check was built around; the 2025 maximum published in 16 C.F.R. § 1.98 is higher and was not
    increased for 2026). A pattern match is not proof a child signed up. Not legal advice.
  fix: >-
    Add an age or date-of-birth question before the account is stored, and
    block under-13 signups unless you have verifiable parental consent.
    Put the gate on the signup form itself, not only in a privacy policy.

  citation: 15 U.S.C. §§ 6501–6506; 16 C.F.R. Part 312 as amended, 90 Fed. Reg. 16918 (Apr. 22, 
    2025) (effective June 23, 2025; most operators must comply by Apr. 22, 2026). Civil penalty 
    maximum $53,088 per violation under 16 C.F.R. § 1.98 (2025 level, unchanged for 2026). 
    https://www.federalregister.gov/documents/2025/04/22/2025-05904/childrens-online-privacy-protection-rule
  snippet: |
    <label>Date of birth <input type="date" name="dob" required></label>
    <p>You must be 13 or older to create an account.</p>
- id: third-party-font
  category: B
  severity: warning
  kind: static
  message: >-
    GDPR / ePrivacy: {detail} loads fonts from a third party ({hosts}).
    The browser sends the visitor's IP address to that server. Cases in
    this family, including the Munich Google Fonts rulings, are framed
    per visitor. Not legal advice.
  fix: >-
    Self-host the font files, or embed them at build time (next/font or
    fontsource), and delete the third-party stylesheet and font URLs.

  citation: LG München I, judgment of 20 Jan. 2022, 3 O 17493/20 (dynamic Google Fonts request 
    transmitted the visitor IP). GDPR Art. 6; ePrivacy Directive 2002/58/EC Art. 5(3). 
    https://www.gesetze-bayern.de/Content/Document/Y-300-Z-BECKRS-B-2022-N-612
  snippet: |
    /* self-host, or in Next.js: */
    import { Inter } from "next/font/google";
    const inter = Inter({ subsets: ["latin"] });
    /* delete every fonts.googleapis.com / fonts.gstatic.com URL */
- id: session-replay
  category: C
  severity: warning
  kind: static
  message: >-
    CIPA and similar wiretap statutes: {detail} loads {vendor} and the
    files read show no consent before recording. Damages in this family
    are often framed per session (about $5,000 in the common CIPA
    framing). This is not a court finding. Not legal advice.
  fix: >-
    Do not load the recorder until the visitor agrees, and turn on input
    masking (mask all inputs and mask all text) so passwords and messages
    are not captured. If you do not need replay, delete the snippet.

  citation: Cal. Penal Code §§ 631(a), 637.2 ($5,000 per violation is the statutory figure, not a 
    prediction). Session-replay and chat-widget complaints are actively litigated; courts disagree 
    about metadata versus message contents (see Popa v. Microsoft and later CIPA rulings). 
    https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=PEN&sectionNum=631.
  snippet: |
    // Start the recorder only after a real yes, and mask inputs.
    posthog.init(KEY, { disable_session_recording: true });
    // after consent: posthog.startSessionRecording()
    // Sentry: replayIntegration({ maskAllText: true, maskAllInputs: true })
- id: session-replay-unmasked
  category: C
  severity: note
  kind: checklist
  message: >-
    Checklist: {detail} loads {vendor} and a consent marker is present,
    but no input-masking setting was found. Confirm recording stays off
    until consent and that inputs are masked. Not legal advice.
  fix: >-
    Turn on the vendor's mask-all-inputs (or equivalent) setting and
    keep the recorder from starting before the visitor agrees.

  citation: Same CIPA statutes as session replay. Masking inputs does not by itself prove consent. 
    https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=PEN&sectionNum=631.
  snippet: |
    replayIntegration({ maskAllText: true, maskAllInputs: true })
- id: posthog-replay-default
  category: C
  severity: note
  kind: checklist
  message: >-
    Checklist: {detail} calls PostHog and does not turn session recording
    off in code. PostHog can still record from the project settings.
    CIPA-style claims are framed per session. Not legal advice.
  fix: >-
    Set disable_session_recording to true unless a visitor has agreed,
    and confirm the PostHog project has session replay switched off.

  citation: PostHog can enable session replay from project settings even when the snippet does not. 
    Same CIPA family as other recorders. https://posthog.com/docs/session-replay
  snippet: |
    posthog.init(KEY, {
      api_host: "https://us.i.posthog.com",
      disable_session_recording: true,
    });
- id: can-spam-footer
  category: D
  severity: warning
  kind: static
  message: >-
    CAN-SPAM: {detail} looks like a marketing email and is missing
    {missing}. Penalties in this family are framed per email.
    Not legal advice.
  fix: >-
    Add a working unsubscribe link and your physical postal address in
    the message. A password-reset or receipt template should not also
    carry a promotion; if it does, it needs both lines.

  citation: 15 U.S.C. § 7704(a)(3)–(5); FTC CAN-SPAM compliance guide. 
    https://www.ftc.gov/business-guidance/resources/can-spam-act-compliance-guide-business
  snippet: |
    <p><a href="{{unsubscribe_url}}">Unsubscribe</a></p>
    <p>Campfire, 1 Market Street, Springfield, IL 62701</p>
- id: auto-renewal-terms
  category: E
  severity: warning
  kind: static
  message: >-
    California auto-renewal law (ARL) and similar state rules: {detail}
    offers a paid subscription without the renewal terms and how to
    cancel in the same view as the button. Exposure is framed per
    subscription. Not legal advice.
  fix: >-
    Put the price, the billing period, when it renews, and how to cancel immediately next to the subscribe
    button. A link to another page does not satisfy the next-to-the-button pattern this check looks for.
    If you show a discount to stop a cancellation, keep a button labeled click to cancel on that same
    screen (California AB 2863, for contracts from July 1, 2025). The FTC's 2024 click-to-cancel rule
    was vacated; do not treat it as the current federal rule.

  citation: Cal. Bus. & Prof. Code §§ 17600–17606, including AB 2863 for contracts entered into, 
    amended, or extended on or after July 1, 2025. ROSCA, 15 U.S.C. §§ 8401–8405, is still in force.
    The FTC's 2024 Negative Option ("click-to-cancel") rule was vacated by the Eighth Circuit on 
    July 8, 2025. 
    https://leginfo.legislature.ca.gov/faces/billTextClient.xhtml?bill_id=202320240AB2863
  snippet: |
    <p>$12 per month. Renews monthly until you cancel. Cancel anytime in Settings.</p>
    <button>Subscribe</button>
    <!-- If you show a save offer, also show a button labeled "click to cancel". -->
- id: auto-renewal-review
  category: E
  severity: note
  kind: checklist
  message: >-
    Checklist: {detail} has a subscribe or trial control but no price in
    that file, so renewal terms could not be checked. If this charges a
    card on a schedule, put the price, the renewal, and how to cancel
    next to the button. Not legal advice.
  fix: >-
    Open the checkout the visitor actually sees and confirm the renewal
    price and the cancellation path sit next to the button.

  citation: Same California automatic-renewal and ROSCA sources as the renewal warning. 
    https://leginfo.legislature.ca.gov/faces/billNavClient.xhtml?law_code=BPC&division=7.&title=&part=3.&chapter=1.&article=9.
  snippet: |
    <p>$12 per month. Renews until you cancel. Cancel anytime in Settings.</p>
    <button>Subscribe</button>
- id: missing-dmca-agent
  category: F
  severity: warning
  kind: static
  message: >-
    DMCA: visitor-facing pages were found and no designated-agent page
    or footer link was found (for example /dmca). A takedown notice then
    has nowhere public to go. This check did not contact copyright.gov
    and does not know whether you registered. Not legal advice.
  fix: >-
    Publish a page with the agent's name, physical address, phone, and
    email, and link it from the footer. Then complete the registration
    checklist — filing is separate from having the page.

  citation: 17 U.S.C. § 512(c)(2). A page is not registration. 
    https://www.copyright.gov/dmca-directory/
  snippet: |
    <footer><a href="/dmca">DMCA / designated agent</a></footer>
- id: dmca-registration-steps
  category: F
  severity: note
  kind: checklist
  message: >-
    Checklist: copyright.gov designated-agent registration is not
    something a file read can see, and this result does not mean you
    registered or failed to. The filing fee this check was built around
    is $6. Not legal advice.
  fix: >-
    1) Sign in at https://www.copyright.gov/dmca-directory/. 2) File a designated agent: name, physical
    address, phone, and email. 3) Pay the $6 fee. 4) Publish that same contact on a page of the site.
    5) Link the page from the footer. 6) Renew before three years are up (37 C.F.R. § 201.38) — amend
    or resubmit, or the designation expires. TriDelPhi did not submit this filing.

  citation: 37 C.F.R. § 201.38(c)(4) (designation expires after three years unless amended or 
    resubmitted); fee $6 under 37 C.F.R. § 201.3. https://www.copyright.gov/dmca-directory/faq.html
  snippet: |
    Designated agent: Ada Lovelace
    1 Market Street, Springfield, IL 62701
    +1-217-555-0100
    dmca@example.com
- id: missing-privacy-policy
  category: G
  severity: warning
  kind: static
  message: >-
    Privacy notice: a visitor-facing page is here and no privacy-policy
    page or footer link was found. State privacy laws and GDPR expect
    this notice; exposure is framed per consumer or per visitor.
    Not legal advice.
  fix: >-
    Publish a real privacy policy (what you collect, why, and who you
    share it with) and link it from the footer. An empty file or a
    "TODO" page does not count.

  citation: GDPR Arts. 13–14; CCPA/CPRA, Cal. Civ. Code §§ 1798.100, 1798.130. 
    https://oag.ca.gov/privacy/ccpa
  snippet: |
    <footer><a href="/privacy">Privacy policy</a></footer>
- id: empty-privacy-policy
  category: G
  severity: warning
  kind: static
  message: >-
    Privacy notice: {detail} is named like a privacy policy but has no
    real text. An empty or placeholder page does not tell a visitor
    what you collect. Exposure is framed per consumer or per visitor.
    Not legal advice.
  fix: >-
    Replace the placeholder with the policy a person can read, covering
    what you collect, why, and how to reach you.

  citation: GDPR Arts. 13–14; CCPA/CPRA notice duties. A placeholder is not a notice. 
    https://oag.ca.gov/privacy/ccpa
  snippet: |
    <h1>Privacy policy</h1>
    <p>We collect your email to sign you in. We do not sell it.
    Write to privacy@example.com.</p>
- id: missing-terms
  category: G
  severity: warning
  kind: static
  message: >-
    Consumer terms: a visitor-facing page is here and no terms-of-service
    page or footer link was found. The gap is framed per customer.
    Not legal advice.
  fix: >-
    Publish terms that match what the product actually does and link
    them from the footer, next to the privacy policy.

  citation: State consumer-protection statutes and, for subscriptions, the automatic-renewal 
    disclosures cited on the renewal check. 
    https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=BPC&sectionNum=17602.
  snippet: |
    <footer><a href="/terms">Terms</a></footer>
- id: empty-terms
  category: G
  severity: warning
  kind: static
  message: >-
    Consumer terms: {detail} is named like terms of service but has no
    real text. A placeholder is not a contract the visitor can read.
    Not legal advice.
  fix: >-
    Replace the placeholder with the terms a person can read before
    they create an account or pay.

  citation: A terms file with no text a person can read does not disclose the deal. 
    https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=BPC&sectionNum=17602.
  snippet: |
    <h1>Terms of service</h1>
    <p>These terms describe the account, billing, and how to close it.
    Questions: legal@example.com.</p>
- id: analytics-before-consent
  category: H
  severity: warning
  kind: static
  message: >-
    ePrivacy / state privacy: {detail} loads {vendors} and no consent
    banner was found in the files read. Tag firings are framed per
    visitor. Not legal advice.
  fix: >-
    Load those tags only after a banner blocks them until the visitor
    accepts. This check cannot see runtime order — a banner that does
    not actually gate the tag is still a problem.

  citation: ePrivacy Directive 2002/58/EC Art. 5(3); GDPR Art. 6. 
    https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32002L0058
  snippet: |
    // Load gtag / pixels only after the visitor accepts.
    if (window.__consent === "accepted") loadAnalytics();
- id: consent-order-unproven
  category: H
  severity: note
  kind: checklist
  message: >-
    Checklist: {vendors} and a consent-banner marker are both in the
    repo. Confirm the banner blocks those tags until the visitor
    accepts. File reads cannot see runtime order. Not legal advice.
  fix: >-
    In the browser, confirm no analytics or ad request leaves before
    the visitor chooses. Reject-all has to be as available as accept.

  citation: ePrivacy Directive 2002/58/EC Art. 5(3). A banner string does not prove the tag waited. 
    https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32002L0058
  snippet: |
    // In the browser devtools Network panel, confirm
    // no analytics request leaves before the visitor chooses.
    // Reject-all has to be as available as accept.
- id: ccpa-do-not-sell
  category: H
  severity: warning
  kind: static
  message: >-
    CCPA/CPRA: {detail} loads an advertising pixel ({vendors}) and no
    "Do Not Sell or Share" link was found. If California residents
    visit, that link is the cheap fix, and Global Privacy Control
    should be honored too. Exposure is framed per consumer.
    Not legal advice.
  fix: >-
    Add a "Do Not Sell or Share My Personal Information" link in the
    footer, and honor the browser's Global Privacy Control signal
    (navigator.globalPrivacyControl or Sec-GPC) by turning off sale
    and share when it is set.

  citation: Cal. Civ. Code §§ 1798.120, 1798.135; opt-out preference signals (Global Privacy 
    Control), Cal. Code Regs. tit. 11, § 7025. https://cppa.ca.gov/regulations/
  snippet: |
    <a href="/privacy#do-not-sell">Do Not Sell or Share My Personal Information</a>
    <script>
    if (navigator.globalPrivacyControl) stopSaleAndShare();
    </script>
- id: ccpa-do-not-sell-checklist
  category: H
  severity: note
  kind: checklist
  message: >-
    Checklist: analytics tags are present and no "Do Not Sell or Share"
    link was found. If you sell or share personal information about
    California residents, that link has to be findable. Exposure is
    framed per consumer. Not legal advice.
  fix: >-
    Add the "Do Not Sell or Share" link if it applies, and honor
    Global Privacy Control. If you do not sell or share, say that in
    the privacy policy instead of ignoring the question.

  citation: CCPA/CPRA and other state privacy laws (Colorado, Connecticut, Virginia, Texas, Oregon, 
    and others) can require a notice and an opt-out when personal information is sold or shared. 
    https://oag.ca.gov/privacy/ccpa
  snippet: |
    <a href="/privacy#do-not-sell">Do Not Sell or Share My Personal Information</a>
- id: ccpa-gpc-checklist
  category: H
  severity: note
  kind: checklist
  message: >-
    Checklist: a "Do Not Sell or Share" marker is present, and no
    Global Privacy Control read (navigator.globalPrivacyControl or
    Sec-GPC) was found. CCPA/CPRA treats that signal as an opt-out
    of sale or share. Not legal advice.
  fix: >-
    When the browser sends Global Privacy Control, stop sale and share
    for that visitor. A footer link alone does not read the signal.

  citation: Cal. Code Regs. tit. 11, § 7025 (businesses must treat an opt-out preference signal such
    as Global Privacy Control as a valid opt-out). https://cppa.ca.gov/regulations/
  snippet: |
    if (navigator.globalPrivacyControl === true) {
      // treat this visit as an opt-out of sale and share
    }
- id: tcpa-sms-consent
  category: I
  severity: warning
  kind: static
  message: >-
    TCPA: {detail} looks like marketing SMS or WhatsApp and does not
    show express consent (agreement to receive texts, message
    frequency, and message-and-data rates). Statutory damages in this
    family are framed per text or call. Not legal advice.
  fix: >-
    Put express written consent next to the phone field before any
    marketing text is sent: the person agrees to receive marketing
    texts, message frequency, "msg & data rates may apply", and how
    to stop. A pre-checked box is a poor version of this.

  citation: 47 U.S.C. § 227; 47 C.F.R. § 64.1200. Marketing texts need prior express written 
    consent. The FCC's 2023 one-to-one consent rule for lead generators was set aside in 2025; the 
    statute was not. https://www.fcc.gov/consumers/guides/stop-unwanted-robocalls-and-texts
  snippet: |
    <label>
      <input type="checkbox" name="sms_consent" required>
      I agree to receive marketing texts. Message frequency varies.
      Msg & data rates may apply. Reply STOP to cancel.
    </label>
- id: tcpa-sms-review
  category: I
  severity: note
  kind: checklist
  message: >-
    Checklist: {detail} collects a text or WhatsApp opt-in and does
    not show express-consent language. If those messages are marketing,
    TCPA damages are framed per text. A verification code is a
    different bucket. Not legal advice.
  fix: >-
    If the texts are marketing, add express consent, frequency, and
    "msg & data rates" before send. If they are one-time codes, keep
    promotions out of that template.

  citation: 47 U.S.C. § 227. A verification code is a different bucket from marketing texts. 
    https://www.fcc.gov/consumers/guides/stop-unwanted-robocalls-and-texts
  snippet: |
    <p>Texts here are one-time verification codes, not promotions.</p>
- id: ai-human-disclosure
  category: J
  severity: note
  kind: checklist
  message: >-
    Checklist (FTC advertising): the files both call a generative model
    and describe outputs as human-made ({detail}). If buyers are told
    a person wrote or drew the output, say it is AI-generated in that
    same place. This is not a finding that an ad was deceptive.
    Not legal advice.
  fix: >-
    Label AI-generated output where it is shown, and take "written by
    our team" (or the equivalent) off anything the model produced.

  citation: FTC Act § 5, 15 U.S.C. § 45 (deceptive claims that a person wrote or drew the output). 
    This check is not a finding that an ad was deceptive. 
    https://www.ftc.gov/business-guidance/blog/2023/02/keep-your-ai-claims-check
  snippet: |
    <p>This draft was generated by AI and edited by a person.</p>
- id: ugc-no-report-path
  category: K
  severity: warning
  kind: static
  message: >-
    DMCA / user content: {detail} accepts uploads and no report,
    moderation, or designated-agent path was found. A visitor needs a
    way to flag material. Not legal advice.
  fix: >-
    Add a visible report control on the upload and a /dmca page with
    a designated agent. A queue nobody can find does not count.

  citation: 17 U.S.C. § 512. A designated agent and a way to send a notice are how a host learns 
    about an infringement claim. https://www.copyright.gov/dmca-directory/
  snippet: |
    <a href="/dmca">Report this</a>
- id: hipaa-may-apply
  category: L
  severity: warning
  kind: checklist
  message: >-
    High-severity checklist — HIPAA may apply: {detail} collects health
    information (a diagnosis, prescription, or similar field). This is
    not a HIPAA audit and not a determination that you are a covered
    entity or business associate. Penalties in this family are framed
    per violation. Not legal advice.
  fix: >-
    Ask counsel whether HIPAA applies before this data is stored. If
    it does, a consumer signup stack is the wrong place for it.

  citation: HIPAA Privacy and Security Rules, 45 C.F.R. Parts 160 and 164. This is not a 
    determination that you are a covered entity or business associate. 
    https://www.hhs.gov/hipaa/for-professionals/privacy/index.html
  snippet: |
    Ask counsel before storing diagnosis, prescription, or similar fields.
    A consumer signup stack is the wrong place for them if HIPAA applies.
- id: glba-may-apply
  category: L
  severity: warning
  kind: checklist
  message: >-
    High-severity checklist — GLBA may apply: {detail} collects bank or
    similar financial-account data. This is not a GLBA audit and not a
    determination that you are a financial institution. Penalties in
    this family are framed per violation. Not legal advice.
  fix: >-
    Ask counsel whether GLBA applies before this data is stored. Do
    not treat a payments form as a bank-account form.

  citation: Gramm-Leach-Bliley Act, 15 U.S.C. §§ 6801–6809. This is not a determination that you are
    a financial institution. 
    https://www.ftc.gov/business-guidance/privacy-security/gramm-leach-bliley-act
  snippet: |
    Ask counsel before storing a routing number, SSN, or bank-account number.
    A card checkout is not a bank-account form.
- id: missing-oss-notice
  category: M
  severity: note
  kind: checklist
  message: >-
    Checklist (copyright / open-source notices): {detail} claims a
    license and no NOTICE, ATTRIBUTION, or THIRD-PARTY-NOTICES file
    was found. This is not a full license scan. Not legal advice.
  fix: >-
    Add a NOTICE or THIRD-PARTY-NOTICES file naming the vendored works
    and the license they shipped with. Keep their license headers.

  citation: License conditions travel with the code (MIT, Apache-2.0 NOTICE). 
    https://www.apache.org/licenses/LICENSE-2.0#redistribution
  snippet: |
    NOTICE

    chart.js — MIT License. Copyright (c) the chart.js authors.
    See vendor/chart.js for the license header.
- id: a11y-primary-page
  category: N
  severity: note
  kind: checklist
  message: >-
    Checklist (accessibility): images were found and none set alt text,
    and no main or nav landmark was found. This is one high-signal
    note, not a WCAG audit. Not legal advice.
  fix: >-
    Add alt text on images that convey meaning, alt="" on decorative
    ones, and a main landmark on the primary page. Then run a real
    accessibility checker.
  citation: ADA Title III, 42 U.S.C. § 12182. DOJ web guidance points at WCAG as a helpful standard;
    this check is not a WCAG audit. https://www.ada.gov/resources/web-guidance/
  snippet: |
    <main>
      <img src="/logo.png" alt="Campfire home">
    </main>
- id: ai-chatbot-disclosure
  category: J
  severity: note
  kind: checklist
  message: 'Checklist (EU AI Act Art. 50 and FTC Act § 5): {detail} calls a generative model from a chat
    surface and no AI disclosure was found next to it. People have to be told they are talking to a machine,
    clearly, at the start. Art. 50 has applied since August 2, 2026. This is not a finding that a disclosure
    was missing in production. Not legal advice.'
  fix: 'Put a plain sentence on the chat itself, before the first message: you are talking to an AI assistant,
    not a person. A line buried in the terms does not do this job.'
  citation: Regulation (EU) 2024/1689 Art. 50 (transparency, applicable from August 2, 2026); FTC 
    Act § 5, 15 U.S.C. § 45. https://artificialintelligenceact.eu/article/50/
  snippet: |
    <p>You are chatting with an AI assistant, not a person.</p>
- id: a11y-missing-alt
  category: N
  severity: note
  kind: checklist
  message: 'Checklist (accessibility demand letters): {detail} has an image with no alt attribute. Demand
    letters often start here. This is not a WCAG audit and not a finding that the page is inaccessible.
    Not legal advice.'
  fix: Add alt text on images that convey meaning and alt="" on decorative ones. Then run a real 
    accessibility checker.
  citation: ADA Title III, 42 U.S.C. § 12182; DOJ, Guidance on Web Accessibility and the ADA (March 
    18, 2022). https://www.ada.gov/resources/web-guidance/
  snippet: |
    <img src="/logo.png" alt="Campfire home">
    <img src="/divider.svg" alt="">
