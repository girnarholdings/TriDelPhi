[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tridelphi"
version = "0.2.0"
description = "Static Agents Rule of Two checker for GitHub Actions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["github-actions", "security", "sarif", "static-analysis", "ai-agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Topic :: Security",
]
# Deliberately minimal. ruamel parses both workflows and the data tables;
# PyYAML is excluded because it resolves `on:` to True and `no`/`off` to False.
dependencies = [
  "ruamel.yaml>=0.18,<0.20",
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.21,<5",
  "pytest>=8,<9",
  "ruff>=0.14,<0.15",
]

[project.scripts]
tridelphi = "tridelphi.cli:main"

[project.urls]
Homepage = "https://github.com/girnarholdings/TriDelPhi"

[tool.setuptools]
packages = ["tridelphi"]

[tool.setuptools.package-data]
tridelphi = ["data/*.yml", "data/*.json", "data/*.md", "data/semgrep-exposure/*.yml", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Deliberately scoped: correctness and dead code, not stylistic opinion.
# A lint gate people argue with is a lint gate people disable.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  "E501",    # line length is enforced by the formatter, not the linter
  "RUF012",  # ClassVar annotations on mutable defaults: noise for our dataclasses
  "B008",    # function call in default arg: not a pattern we use
]

[tool.ruff.lint.per-file-ignores]
# Tests import fixtures for their side effects and shadow names freely.
"tests/*" = ["F401", "F811"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:tridelphi.*"]
